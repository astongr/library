<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Library</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <!--Modal for adding new book-->
    <dialog id="book-dialog">
      <div class="modal-header">
        <img class="header-icon" src="book-plus.svg" alt="" />
        <div class="header-text">
          <h2 class="form-header">Add New Book</h2>
          <p class="form-subtext">Please enter the details to add your book.</p>
        </div>
      </div>
      <form id="book-form">
        <input type="text" id="title" placeholder="Title" />
        <input type="text" id="author" placeholder="Author" />
        <input type="number" id="pages" placeholder="Pages" />
        <label class="read-label"
          ><input type="checkbox" id="read" />Have you read this book?</label
        >
        <div class="modal-buttons">
          <button type="submit">Add Book</button>
          <button type="button" id="cancel-button">Cancel</button>
        </div>
      </form>
    </dialog>
    <!--Main page container-->
    <div class="container">
      <aside class="sidebar">
        <div class="logo">
          <img src="logo.svg" alt="My Library logo" class="logo-icon" />
          <h1>My Library</h1>
        </div>
        <button id="modal-button">Add Book</button>
        <ul class="top-list">
          <li>
            <a href="#" class="menu-item">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-book-text preview-icon">
                <path
                  d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a1 1 0 0 1 0-5H20" />
                <path d="M8 11h8" />
                <path d="M8 7h6" />
              </svg>
              <span>Category</span>
            </a>
          </li>
          <li>
            <a href="#" class="menu-item">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-download preview-icon">
                <path d="M12 15V3" />
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                <path d="m7 10 5 5 5-5" />
              </svg>
              <span>Download</span>
            </a>
          </li>
          <li>
            <a href="#" class="menu-item">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-heart-plus preview-icon">
                <path
                  d="m14.479 19.374-.971.939a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5a5.2 5.2 0 0 1-.219 1.49" />
                <path d="M15 15h6" />
                <path d="M18 12v6" />
              </svg>
              <span>Favourite</span>
            </a>
          </li>
          <li>
            <a href="#" class="menu-item">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-book-open preview-icon">
                <path d="M12 5v16" />
                <path
                  d="M20.001 19A2 2 0 0022 17V5a2 2 0 00-1.999-2L16 3.002A5 5 0 0012 5a5 5 0 00-4-2H4a2 2 0 00-2 2v12a2 2 0 001.999 2H8a5 5 0 014 2 5 5 0 014-2z" />
              </svg>
              <span>Read</span>
            </a>
          </li>
          <li>
            <a href="#" class="menu-item">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-book-x preview-icon">
                <path d="m14.5 7.5-5 5" />
                <path
                  d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a1 1 0 0 1 0-5H20" />
                <path d="m9.5 7.5 5 5" />
              </svg>
              <span>Unread</span>
            </a>
          </li>
        </ul>
        <ul class="bottom-list">
          <li>
            <a href="#" class="menu-item">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-settings preview-icon">
                <path
                  d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915" />
                <circle cx="12" cy="12" r="3" />
              </svg>
              <span>Settings</span>
            </a>
          </li>
          <li>
            <a href="#" class="menu-item">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-shield-question-mark preview-icon">
                <path
                  d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" />
                <path d="M9.1 9a3 3 0 0 1 5.82 1c0 2-3 3-3 3" />
                <path d="M12 17h.01" />
              </svg>
              <span>Support</span>
            </a>
          </li>
          <li>
            <a href="#" class="menu-item">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-log-out preview-icon">
                <path d="m16 17 5-5-5-5" />
                <path d="M21 12H9" />
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              </svg>
              <span>Logout</span>
            </a>
          </li>
        </ul>
      </aside>

      <header class="header">
        <div class="search-bar">
          <img class="symbol" src="magnify.svg" alt="" />
          <input
            type="search"
            class="search-input"
            id="site-search"
            name="search" />
        </div>

        <div class="notification">
          <img class="symbol" src="bell-ring-outline.svg" alt="" />
          <img src="library-avatar.svg" class="avatar" alt="" />
          <p>Aston Godwin-Ross</p>
        </div>
      </header>
      <main>
        <section class="section-card">
          <h2>My Books</h2>
          <div id="read-books-grid" class="books-grid"></div>
        </section>

        <section class="section-card">
          <h2>To-Read</h2>
          <div id="unread-books-grid" class="books-grid"></div>
        </section>
      </main>
    </div>
  </body>
</html>
