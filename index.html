<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Library</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <!--Modal for adding new book-->
    <dialog id="book-dialog">
      <div class="modal-header">
        <img class="header-icon" src="book-plus.svg" alt="" />
        <div class="header-text">
          <h2 class="form-header">Add New Book</h2>
          <p class="form-subtext">Please enter the details to add your book.</p>
        </div>
      </div>
      <form id="book-form">
        <input type="text" id="title" placeholder="Title" />
        <input type="text" id="author" placeholder="Author" />
        <input type="number" id="pages" placeholder="Pages" />
        <label class="read-label"
          ><input type="checkbox" id="read" />Have you read this book?</label
        >
        <div class="modal-buttons">
          <button type="submit">Add Book</button>
          <button type="button" id="cancel-button">Cancel</button>
        </div>
      </form>
    </dialog>
    <!--Main page container-->
    <div class="container">
      <aside class="sidebar">
        <div class="logo">
          <img src="logo.svg" alt="My Library logo" class="logo-icon" />
          <h1>My Library</h1>
        </div>
        <button id="modal-button">Add Book</button>
        <ul class="sidebar-list">
          <li>
            <a href="#" class="menu-item">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-book-text preview-icon">
                <path
                  d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a1 1 0 0 1 0-5H20" />
                <path d="M8 11h8" />
                <path d="M8 7h6" />
              </svg>
              <span>Category</span>
            </a>
          </li>
          <li>
            <a href="#" class="menu-item">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-download preview-icon">
                <path d="M12 15V3" />
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                <path d="m7 10 5 5 5-5" />
              </svg>
              <span>Download</span>
            </a>
          </li>
          <li>
            <a href="#" class="menu-item">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-heart-plus preview-icon">
                <path
                  d="m14.479 19.374-.971.939a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5a5.2 5.2 0 0 1-.219 1.49" />
                <path d="M15 15h6" />
                <path d="M18 12v6" />
              </svg>
              <span>Favourite</span>
            </a>
          </li>
          <li class="logout-item">
            <a href="#" class="menu-item">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-log-out preview-icon">
                <path d="m16 17 5-5-5-5" />
                <path d="M21 12H9" />
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              </svg>
              <span>Logout</span>
            </a>
          </li>
        </ul>
      </aside>

      <header class="header">
        <h2>This is the Header</h2>
      </header>
      <main>
        <h2>Main Section</h2>
        <div id="library"></div>
      </main>
    </div>
  </body>
</html>
