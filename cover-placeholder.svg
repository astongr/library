<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="300" height="420" role="img" aria-label="No cover available">
  <!-- background -->
  <rect width="300" height="420" fill="#1a1a1a" />

  <!-- subtle inner panel -->
  <rect x="30" y="30" width="240" height="360" rx="8" fill="none" stroke="#2e2e2e" stroke-width="2" />

  <!-- open book icon (orange), centred -->
  <g transform="translate(150 170)" stroke="#f97316" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- left page -->
    <path d="M0 -30 C -18 -42, -42 -42, -58 -34 L -58 34 C -42 26, -18 26, 0 38 Z" />
    <!-- right page -->
    <path d="M0 -30 C 18 -42, 42 -42, 58 -34 L 58 34 C 42 26, 18 26, 0 38 Z" />
    <!-- spine -->
    <line x1="0" y1="-30" x2="0" y2="38" />
  </g>

  <!-- "No Cover" text -->
  <text x="150" y="300" text-anchor="middle" fill="#9ca3af" font-family="Verdana, sans-serif" font-size="22" font-weight="bold">No Cover</text>
  <text x="150" y="328" text-anchor="middle" fill="#6b7280" font-family="Verdana, sans-serif" font-size="15">Available</text>
</svg>
